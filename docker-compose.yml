# ============================================================
# PaperReader 一键编排：前端(Nginx) + 后端(FastAPI) + PostgreSQL + Redis
#
# 用法：
#   cp .env.example .env      # 填好 API Key 等必填项
#   docker compose up -d --build
#   浏览器访问 http://localhost:8080
#
# 端口冲突？本机已占用 5432/6379/8000/8080 时，在 .env 里改：
#   POSTGRES_PORT=15432
#   REDIS_PORT=16379
#   BACKEND_PORT=18000
#   FRONTEND_PORT=8080
# ============================================================
name: paperreader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paperreader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: paperreader
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # 只绑本机回环，不对局域网暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperreader -d paperreader"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # 容器内固定指向 compose 网络里的服务名，不用 .env 里的 localhost
      DATABASE_URL: postgresql+psycopg2://paperreader:${POSTGRES_PASSWORD}@postgres:5432/paperreader
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET}
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 里设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?请在 .env 里设置 EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    volumes:
      - paper-data:/app/data        # PDF 原件 + Chroma 向量库，升级镜像不丢
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"    # 调试用直连入口；正常流量走 nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy   # 等后端 /api/health 探活通过再起

volumes:
  pgdata:
  paper-data:
