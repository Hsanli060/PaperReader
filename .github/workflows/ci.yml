name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # test_agent / test_papers_citations_api 依赖真实 PG（迁移后种子数据）和 Redis
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperreader
          POSTGRES_PASSWORD: paperreader
          POSTGRES_DB: paperreader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperreader -d paperreader"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # LLM/Embedding 全部走假 key：测试里的 LLM 调用均被 mock，不产生真实请求
      DATABASE_URL: postgresql+psycopg2://paperreader:paperreader@localhost:5432/paperreader
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-not-a-real-secret
      LLM_API_KEY: dummy-key
      LLM_BASE_URL: https://api.deepseek.com
      LLM_MODEL: deepseek-chat
      EMBEDDING_API_KEY: dummy-key
      EMBEDDING_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      EMBEDDING_MODEL: text-embedding-v4
      EMBEDDING_DIM: "1024"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: PaperReader-backend-requirements.txt

      - name: 安装依赖
        run: pip install -r ../PaperReader-backend-requirements.txt

      - name: 数据库迁移
        run: alembic upgrade head

      - name: 写入 CI 种子数据（测试借用 paper 1/3 与 user 1）
        run: |
          PGPASSWORD=paperreader psql -h localhost -U paperreader -d paperreader <<'SQL'
          INSERT INTO users (id, username, password_hash)
          VALUES (1, 'ci-user', 'ci-not-a-real-hash') ON CONFLICT (id) DO NOTHING;
          INSERT INTO papers (id, arxiv_id, title, authors, status)
          VALUES (1, '2312.00752', 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces', '[]', 'ready'),
                 (3, '9999.99999', 'CI Seed Paper For Citations', '[]', 'ready')
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: 运行 pytest（排除需真实向量库/Embedding API 的集成测试）
        # test_rag.py 与 test_agent.py::test_search_paper_tool_returns_hits 走真实
        # RAG 检索（真 Chroma 库 + 真 Embedding API），CI 里没有已索引数据，故排除
        run: >-
          python -m pytest tests/ -v
          --ignore=tests/test_rag.py
          --deselect tests/test_agent.py::test_search_paper_tool_returns_hits

  compose-check:
    name: Docker 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config 校验
        run: |
          cp .env.example .env
          docker compose config -q
          echo "docker-compose.yml 语法与变量校验通过"
